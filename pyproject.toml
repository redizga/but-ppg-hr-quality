[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "butppg"
version = "0.1.0"
description = "Reproducible study of PPG signal-quality classification and heart-rate prediction on BUT PPG v2.0.0"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Golikov" },
    { name = "Budilov" },
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
# Heavier stacks are opt-in so the reproducibility core installs fast.
baselines = ["xgboost>=2.0"]
deep = ["torch>=2.1"]
viz = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "ruff>=0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

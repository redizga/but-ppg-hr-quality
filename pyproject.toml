[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "butppg-orchestrator"
version = "0.1.0"
description = "Orchestrator for BUT PPG: build per-model marts (SIGMA-PPG / OpenTSLM), launch training, fetch results."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Golikov" }, { name = "Budilov" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
# Data download (BUT PPG WFDB records).
data = ["wfdb>=4.1"]
# 1D-CNN / ResNet1D baseline + SIGMA-PPG / OpenTSLM adapters.
deep = ["torch>=2.1", "einops>=0.7"]
baselines = ["xgboost>=2.0"]
dev = ["pytest>=7.4", "ruff>=0.1"]

[project.scripts]
orch = "butppg.orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
